schema
  @link(url: "https://specs.apollo.dev/link/v1.0")
  @link(url: "https://specs.apollo.dev/join/v0.3", for: EXECUTION)
{
  query: Query
  mutation: Mutation
}

directive @join__enumValue(graph: join__Graph!) repeatable on ENUM_VALUE

directive @join__field(graph: join__Graph, requires: join__FieldSet, provides: join__FieldSet, type: String, external: Boolean, override: String, usedOverridden: Boolean) repeatable on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

directive @join__graph(name: String!, url: String!) on ENUM_VALUE

directive @join__implements(graph: join__Graph!, interface: String!) repeatable on OBJECT | INTERFACE

directive @join__type(graph: join__Graph!, key: join__FieldSet, extension: Boolean! = false, resolvable: Boolean! = true, isInterfaceObject: Boolean! = false) repeatable on OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR

directive @join__unionMember(graph: join__Graph!, member: String!) repeatable on UNION

directive @link(url: String, as: String, for: link__Purpose, import: [link__Import]) repeatable on SCHEMA

type AuthPayload
  @join__type(graph: AUTH)
{
  token: String!
  user: User!
}

"""
type User @key(fields: "id") {
    id: ID!
    channels: [Channel!]!
}
"""
type Channel
  @join__type(graph: CHANNEL, key: "id")
  @join__type(graph: MESSAGE)
{
  createdAt: String! @join__field(graph: CHANNEL)
  createdBy: ID! @join__field(graph: CHANNEL)
  createdByUser: User! @join__field(graph: CHANNEL)
  description: String @join__field(graph: CHANNEL)
  id: ID!
  isPrivate: Boolean! @join__field(graph: CHANNEL)
  memberCount: Int! @join__field(graph: CHANNEL)
  members: [ChannelMember!]! @join__field(graph: CHANNEL)
  name: String! @join__field(graph: CHANNEL)
  updatedAt: String! @join__field(graph: CHANNEL)
}

type ChannelMember
  @join__type(graph: CHANNEL)
{
  channelId: ID!
  id: ID!
  joinedAt: String!
  lastReadMessageId: ID
  role: Role!
  user: User!
  userId: ID!
}

input CreateChannelInput
  @join__type(graph: CHANNEL)
{
  description: String
  isPrivate: Boolean = false
  name: String!
}

input DeleteMessageInput
  @join__type(graph: MESSAGE)
{
  deleteUserId: ID!
  messageId: ID
}

scalar join__FieldSet

enum join__Graph {
  AUTH @join__graph(name: "auth", url: "http://localhost:8081/graphql")
  CHANNEL @join__graph(name: "channel", url: "http://localhost:8082/graphql")
  MESSAGE @join__graph(name: "message", url: "http://localhost:8083/graphql")
}

scalar link__Import

enum link__Purpose {
  """
  `SECURITY` features provide metadata necessary to securely resolve fields.
  """
  SECURITY

  """
  `EXECUTION` features provide metadata necessary for operation execution.
  """
  EXECUTION
}

""" Main Message type"""
type Message
  @join__type(graph: MESSAGE)
{
  channel: Channel!
  channelId: ID!
  content: String!
  createdAt: String!
  fileUrl: String
  id: ID!
  isDeleted: Boolean!
  messageType: MessageType!
  replies: [Message!]!
  replyTo: Message
  replyToMessageId: ID
  updatedAt: String
  user: User!
  userId: ID!
}

""" Connection types for pagination"""
type MessageConnection
  @join__type(graph: MESSAGE)
{
  edges: [MessageEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type MessageEdge
  @join__type(graph: MESSAGE)
{
  cursor: String!
  node: Message!
}

enum MessageType
  @join__type(graph: MESSAGE)
{
  FILE @join__enumValue(graph: MESSAGE)
  IMAGE @join__enumValue(graph: MESSAGE)
  TEXT @join__enumValue(graph: MESSAGE)
}

""" Mutation type"""
type Mutation
  @join__type(graph: AUTH)
  @join__type(graph: CHANNEL)
  @join__type(graph: MESSAGE)
{
  login(password: String!, username: String!): AuthPayload! @join__field(graph: AUTH)
  logout: Boolean! @join__field(graph: AUTH)
  register(email: String, password: String!, username: String!): Boolean! @join__field(graph: AUTH)

  """ Channel CRUD"""
  createChannel(input: CreateChannelInput!): Channel! @join__field(graph: CHANNEL)
  deleteChannel(id: ID!): Boolean! @join__field(graph: CHANNEL)
  inviteToChannel(channelId: ID!, userId: ID!): ChannelMember! @join__field(graph: CHANNEL)

  """ Membership management"""
  joinChannel(channelId: ID!): ChannelMember! @join__field(graph: CHANNEL)
  leaveChannel(channelId: ID!): Boolean! @join__field(graph: CHANNEL)
  removeFromChannel(channelId: ID!, userId: ID!): Boolean! @join__field(graph: CHANNEL)
  updateChannel(id: ID!, input: UpdateChannelInput!): Channel! @join__field(graph: CHANNEL)
  updateMemberRole(channelId: ID!, role: Role!, userId: ID!): ChannelMember! @join__field(graph: CHANNEL)
  deleteMessage(input: DeleteMessageInput): Boolean! @join__field(graph: MESSAGE)
  sendMessage(input: SendMessageInput!): Message! @join__field(graph: MESSAGE)
  updateMessage(input: UpdateMessageInput): Message! @join__field(graph: MESSAGE)
}

type PageInfo
  @join__type(graph: MESSAGE)
{
  endCursor: String
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
}

""" Query type - only define once!"""
type Query
  @join__type(graph: AUTH)
  @join__type(graph: CHANNEL)
  @join__type(graph: MESSAGE)
{
  me: User @join__field(graph: AUTH)
  users: [User!]! @join__field(graph: AUTH)

  """ Permission checks"""
  canUserJoinChannel(channelId: ID!): Boolean! @join__field(graph: CHANNEL)
  canUserSendMessage(channelId: ID!): Boolean! @join__field(graph: CHANNEL)

  """ Get specific channel"""
  channel(id: ID!): Channel @join__field(graph: CHANNEL)

  """ Get channel members"""
  channelMembers(channelId: ID!): [ChannelMember!]! @join__field(graph: CHANNEL)

  """ Get all channels user has access to"""
  channels: [Channel!]! @join__field(graph: CHANNEL)

  """ Get public channels (for discovery)"""
  publicChannels: [Channel!]! @join__field(graph: CHANNEL)
  message(id: ID!): Message @join__field(graph: MESSAGE)

  """ Using consistent parameter names"""
  messages(after: String, before: String, channelId: ID!, first: Int = 50, last: Int): MessageConnection! @join__field(graph: MESSAGE)
}

enum Role
  @join__type(graph: CHANNEL)
{
  ADMIN @join__enumValue(graph: CHANNEL)
  MEMBER @join__enumValue(graph: CHANNEL)
  MODERATOR @join__enumValue(graph: CHANNEL)
}

input SendMessageInput
  @join__type(graph: MESSAGE)
{
  channelId: ID!
  content: String!
  fileUrl: String
  messageType: MessageType = TEXT
  replyTo: ID
}

input UpdateChannelInput
  @join__type(graph: CHANNEL)
{
  description: String
  isPrivate: Boolean
  name: String
}

input UpdateMessageInput
  @join__type(graph: MESSAGE)
{
  content: String!
  messageId: ID
  updateUserId: ID!
}

type User
  @join__type(graph: AUTH, key: "id")
  @join__type(graph: CHANNEL, key: "id")
  @join__type(graph: MESSAGE)
{
  email: String @join__field(graph: AUTH)
  id: ID!
  username: String! @join__field(graph: AUTH)
  channels: [Channel!]! @join__field(graph: CHANNEL)
}
